pid /app/tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /app/tmp/client;
  proxy_temp_path /app/tmp/proxy;
  fastcgi_temp_path /app/tmp/fastcgi;
  uwsgi_temp_path /app/tmp/uwsgi;
  scgi_temp_path /app/tmp/scgi;
  server {
    listen 10000;
    root /app/public;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 180s;
    }
    location = /actuator/health { proxy_pass http://127.0.0.1:8081; }
    location / { try_files $uri /index.html; }
  }
}
